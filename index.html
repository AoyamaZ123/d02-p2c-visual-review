<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FIRST LIGHT D02 P2C Visual Review</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, "Segoe UI", sans-serif; }
    body { margin: 0; background: #111; color: #eee; }
    main { width: min(1600px, 96vw); margin: 24px auto 60px; }
    h1 { margin: 0 0 8px; font-size: clamp(24px, 3vw, 42px); }
    p { margin: 0 0 24px; color: #bbb; }
    section { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 18px 0 34px; }
    figure { margin: 0; background: #1b1b1b; border: 1px solid #333; border-radius: 8px; overflow: hidden; }
    img { display: block; width: 100%; height: auto; }
    figcaption { padding: 10px 12px; font-weight: 650; }
    @media (max-width: 760px) { section { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<main>
  <h1>FIRST LIGHT D02 P2C</h1>
  <p>每组左侧/第一张为当前场景，右侧/第二张为授权参考。点击图片可查看原图。</p>

  <h2>Reload</h2>
  <section>
    <figure><a href="current-reload.png"><img src="current-reload.png" alt="Current Reload"></a><figcaption>当前 Reload · 1920×1080 · FOV 80</figcaption></figure>
    <figure><a href="reference-reload.png"><img src="reference-reload.png" alt="Reference Reload"></a><figcaption>授权参考 Reload</figcaption></figure>
  </section>

  <h2>Vault</h2>
  <section>
    <figure><a href="current-vault.png"><img src="current-vault.png" alt="Current Vault"></a><figcaption>当前 Vault · 1920×1080 · FOV 80</figcaption></figure>
    <figure><a href="reference-vault.png"><img src="reference-vault.png" alt="Reference Vault"></a><figcaption>授权参考 Vault</figcaption></figure>
  </section>

  <h2>Aim</h2>
  <section>
    <figure><a href="current-aim.png"><img src="current-aim.png" alt="Current Aim"></a><figcaption>当前 Aim · 1920×1080 · FOV 65</figcaption></figure>
    <figure><a href="reference-aim.png"><img src="reference-aim.png" alt="Reference Aim"></a><figcaption>授权参考 Aim</figcaption></figure>
  </section>
</main>
</body>
</html>
