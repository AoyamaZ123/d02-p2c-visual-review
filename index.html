<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FIRST LIGHT D02 P2D Visual Review</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, "Segoe UI", sans-serif; }
    body { margin: 0; background: #111; color: #eee; }
    main { width: min(1740px, 96vw); margin: 24px auto 60px; }
    h1 { margin: 0 0 8px; font-size: clamp(24px, 3vw, 42px); }
    p { margin: 0 0 24px; color: #bbb; }
    section { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 18px 0 34px; }
    figure { margin: 0; background: #1b1b1b; border: 1px solid #333; border-radius: 8px; overflow: hidden; }
    img { display: block; width: 100%; height: auto; }
    figcaption { padding: 10px 12px; font-weight: 650; }
    .current { border-color: #57677d; }
    .reference { border-color: #7d6540; }
    @media (max-width: 980px) { section { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<main>
  <h1>FIRST LIGHT D02 P2D</h1>
  <p>每组依次为当前 Beauty、当前 Gameplay、授权参考。点击图片可查看 1920×1080 原图。</p>

  <h2>Reload</h2>
  <section>
    <figure class="current"><a href="current-beauty-reload.png"><img src="current-beauty-reload-thumb.jpg" alt="P2D Beauty Reload"></a><figcaption>当前 Beauty Reload · FOV 80</figcaption></figure>
    <figure class="current"><a href="current-gameplay-reload.png"><img src="current-gameplay-reload-thumb.jpg" alt="P2D Gameplay Reload"></a><figcaption>当前 Gameplay Reload · FOV 80</figcaption></figure>
    <figure class="reference"><a href="reference-reload.png"><img src="reference-reload-thumb.jpg" alt="Reference Reload"></a><figcaption>授权参考 Reload</figcaption></figure>
  </section>

  <h2>Vault</h2>
  <section>
    <figure class="current"><a href="current-beauty-vault.png"><img src="current-beauty-vault-thumb.jpg" alt="P2D Beauty Vault"></a><figcaption>当前 Beauty Vault · FOV 80</figcaption></figure>
    <figure class="current"><a href="current-gameplay-vault.png"><img src="current-gameplay-vault-thumb.jpg" alt="P2D Gameplay Vault"></a><figcaption>当前 Gameplay Vault · FOV 80</figcaption></figure>
    <figure class="reference"><a href="reference-vault.png"><img src="reference-vault-thumb.jpg" alt="Reference Vault"></a><figcaption>授权参考 Vault</figcaption></figure>
  </section>

  <h2>Aim</h2>
  <section>
    <figure class="current"><a href="current-beauty-aim.png"><img src="current-beauty-aim-thumb.jpg" alt="P2D Beauty Aim"></a><figcaption>当前 Beauty Aim · FOV 65</figcaption></figure>
    <figure class="current"><a href="current-gameplay-aim.png"><img src="current-gameplay-aim-thumb.jpg" alt="P2D Gameplay Aim"></a><figcaption>当前 Gameplay Aim · FOV 65</figcaption></figure>
    <figure class="reference"><a href="reference-aim.png"><img src="reference-aim-thumb.jpg" alt="Reference Aim"></a><figcaption>授权参考 Aim</figcaption></figure>
  </section>
</main>
</body>
</html>
